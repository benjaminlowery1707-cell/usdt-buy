<!DOCTYPE html>

<meta charset="UTF-8">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050807;
    --panel:#0b100e;
    --panel2:#0e1512;
    --green:#00ff88;
    --green2:#00c96b;
    --text:#f2fff8;
    --muted:#91a39a;
    --border:rgba(0,255,136,.14);
    --danger:#ff4d67;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 20% 0%,rgba(0,255,136,.10),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(0,190,255,.08),transparent 25%),
        var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================
   ANIMATED BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-3;
    background-image:
        linear-gradient(rgba(0,255,136,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,136,.025) 1px,transparent 1px);
    background-size:55px 55px;
    mask-image:linear-gradient(to bottom,black,transparent 85%);
    animation:gridMove 18s linear infinite;
}

body::after{
    content:"";
    position:fixed;
    width:450px;
    height:450px;
    border-radius:50%;
    left:-180px;
    top:30%;
    background:rgba(0,255,136,.045);
    filter:blur(90px);
    pointer-events:none;
    z-index:-2;
    animation:bgOrb 9s ease-in-out infinite alternate;
}

@keyframes gridMove{
    from{transform:translateY(0);}
    to{transform:translateY(55px);}
}

@keyframes bgOrb{
    0%{transform:translate(0,0) scale(.8);}
    100%{transform:translate(220px,-100px) scale(1.25);}
}

/* Floating particles */

.particle{
    position:fixed;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
    opacity:.35;
    pointer-events:none;
    z-index:-1;
    animation:particleFloat linear infinite;
}

.p1{left:8%;bottom:-10px;animation-duration:12s;}
.p2{left:18%;bottom:-10px;animation-duration:16s;animation-delay:2s;}
.p3{left:32%;bottom:-10px;animation-duration:13s;animation-delay:4s;}
.p4{left:47%;bottom:-10px;animation-duration:18s;animation-delay:1s;}
.p5{left:62%;bottom:-10px;animation-duration:14s;animation-delay:5s;}
.p6{left:76%;bottom:-10px;animation-duration:17s;animation-delay:3s;}
.p7{left:89%;bottom:-10px;animation-duration:11s;animation-delay:6s;}

@keyframes particleFloat{
    0%{
        transform:translateY(0) scale(.5);
        opacity:0;
    }
    15%{opacity:.45;}
    70%{opacity:.3;}
    100%{
        transform:translateY(-110vh) scale(1.3);
        opacity:0;
    }
}

/* =========================
   HEADER
========================= */

header{
    height:72px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,8,7,.78);
    backdrop-filter:blur(18px);
    animation:headerDrop .7s ease both;
}

@keyframes headerDrop{
    from{
        opacity:0;
        transform:translateY(-25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
    letter-spacing:1px;
}

.logo-icon{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--green);
    color:#001a0c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:1000;
    box-shadow:
        0 0 15px rgba(0,255,136,.3),
        0 0 45px rgba(0,255,136,.12);
    animation:logoPulse 2.5s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{
        box-shadow:0 0 15px rgba(0,255,136,.3);
        transform:scale(1);
    }
    50%{
        box-shadow:
            0 0 25px rgba(0,255,136,.55),
            0 0 60px rgba(0,255,136,.18);
        transform:scale(1.05);
    }
}

.logo-icon svg{
    width:25px;
    height:25px;
    display:block;
}

.usdt-logo{
    width:22px;
    height:22px;
    display:inline-block;
    vertical-align:middle;
    flex:0 0 auto;
}

.usdt-logo.sm{width:18px;height:18px;}
.usdt-logo.lg{width:26px;height:26px;}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.menu-btn{
    width:43px;
    height:43px;
    border:1px solid var(--border);
    background:#0b120f;
    color:white;
    border-radius:10px;
    font-size:22px;
    transition:.25s ease;
}

.menu-btn:hover{
    color:var(--green);
    border-color:var(--green);
    box-shadow:0 0 22px rgba(0,255,136,.15);
    transform:rotate(5deg) scale(1.05);
}

.hero{

@keyframes heroAppear{

    );

    animation:borderSweep 6s linear infinite;

@keyframes borderSweep{

    100%{background-position:-200% 0;}
}

.hero-content{

    z-index:5;
    max-width:720px;
    margin:0 auto;
    text-align:center;
}

.hero-coins{

    pointer-events:none;
    overflow:hidden;
}

.hero-coin{
    position:absolute;
    width:62px;
    height:62px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 35% 28%,#39c99a 0,#26a17b 48%,#12634e 100%);

.hero-coin:nth-child(1){
    left:6%;

.hero-coin:nth-child(5){

@keyframes usdtFloat{

    }

.hero-glow{

    width:300px;
    height:300px;

    background:rgba(38,161,123,.08);
    filter:blur(35px);
    animation:heroPulse 4s ease-in-out infinite;
}

@keyframes heroPulse{

        transform:translate(-50%,-50%) scale(1.12);

.badge{

.hero h1{

    animation:titleReveal 1s .15s ease both;
}

@keyframes titleReveal{

    to{
        opacity:1;
        transform:translateY(0);

    }
}

.hero h1 span{
    color:var(--green);
    text-shadow:
        0 0 15px rgba(0,255,136,.25),
        0 0 45px rgba(0,255,136,.12);

}

@keyframes textGlow{

.hero p{

    }

/* =========================
   SIDE MENU
========================= */

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);

    backdrop-filter:blur(3px);
}

.overlay.show{
    display:block;
    animation:overlayIn .25s ease;
}

@keyframes overlayIn{
    from{opacity:0;}

}

    z-index:200;

.side-menu.open{

.close-menu:hover{

.menu-user{

.menu-user strong{

.menu-link:hover{

    transform:translateX(5px);
}

.menu-danger{

    margin:20px auto 60px;
    padding:0 20px;

    border:1px solid var(--border);
    border-radius:22px;
    padding:28px;
    box-shadow:0 20px 70px rgba(0,0,0,.3);
    animation:cardReveal .8s .2s ease both;
    transition:.35s ease;
}

@keyframes cardReveal{
    from{
        opacity:0;
        transform:translateY(35px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.buy-card::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-100px;

    filter:blur(25px);
    animation:cardOrb 5s ease-in-out infinite alternate;

@keyframes cardOrb{
    from{transform:scale(.7);}
    to{transform:scale(1.4);}
}

.buy-card:hover{

.card-title{

}

.card-title h2{

.live{
    color:var(--green);
    font-size:12px;
    display:flex;

    align-items:center;

.live i{

    animation:livePulse 1.4s infinite;
}

@keyframes livePulse{
    0%{transform:scale(.8);opacity:.5;}

}
